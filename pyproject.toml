[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swp-automation"
version = "0.1.0"
description = "A modular automation platform for scheduled tasks, reminders, resource updates, and integrations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=25.1,<26",
    "typer>=0.15,<1",
    "sqlalchemy>=2.0,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.27,<1",
]
scheduler = [
    "apscheduler>=3.11,<4",
]
storage = [
    "aiosqlite>=0.21,<1",
    "asyncpg>=0.30,<1",
]
redis = [
    "redis>=5.2,<6",
]
bili = [
    "requests>=2.31,<3",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "mypy>=1.15,<2",
    "httpx>=0.27,<1",
]
all = [
    "swp-automation[api,scheduler,storage,redis,bili,dev]",
]

[project.scripts]
automation = "apps.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "modules", "integrations"]

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
