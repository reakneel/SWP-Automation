name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[api,scheduler,storage,redis,dev,bili]"
      - name: Ruff format
        run: ruff format .
      - name: Ruff check and fix
        run: ruff check . --fix
      - name: Ruff check
        run: ruff check .
      - name: Tests
        run: pytest
